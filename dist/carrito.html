<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bolsa · Malakoi</title><style>
:root{--ink:#111;--paper:#f7f7f5;--line:#d7d7d2;--muted:#6d6d68}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,'Noto Sans',system-ui,sans-serif}a{color:inherit;text-decoration:none}.nav{height:110px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 5vw;gap:40px}.logo{width:156px;height:34px;background:url('/assets/imagen_2026-10-02_215000798-Photoroom-CDwBUOZS.png') center/contain no-repeat}.links{display:flex;gap:24px;font-size:12px;font-weight:700;letter-spacing:.1em}.bag{margin-left:auto;font-size:12px;font-weight:700}.wrap{padding:80px 5vw;max-width:1180px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--muted);text-transform:uppercase}.wrap h1{font-size:clamp(50px,8vw,100px);line-height:.86;letter-spacing:-.08em;margin:24px 0 54px}.cart{display:grid;grid-template-columns:1fr 360px;gap:48px}.items{border-top:1px solid var(--ink)}.item{display:grid;grid-template-columns:140px 1fr auto;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);align-items:center}.item img{width:140px;height:140px;object-fit:cover;background:#fff}.item h2{font-size:17px;margin:0 0 8px}.item p{color:var(--muted);font-size:13px;margin:0}.remove{border:0;background:none;color:var(--muted);font-size:12px}.summary{background:#fff;padding:28px;height:max-content}.summary h2{font-size:18px;margin:0 0 22px}.row{display:flex;justify-content:space-between;padding:11px 0;color:var(--muted);font-size:13px}.total{border-top:1px solid var(--line);margin-top:12px;padding-top:18px;color:var(--ink);font-weight:700}.checkout{display:block;text-align:center;background:#111;color:#fff;padding:16px;margin-top:24px;font-size:13px;font-weight:700}.empty{border-top:1px solid var(--ink);padding:30px 0;color:var(--muted)}@media(max-width:800px){.nav{height:84px;padding:0 18px;gap:14px}.links{gap:10px;font-size:9px}.wrap{padding:55px 18px}.cart{grid-template-columns:1fr}.item{grid-template-columns:90px 1fr}.item img{width:90px;height:110px}.remove{grid-column:2}}

</head><body><div id="shared-header" data-active="bag"></div><main class="wrap"><div class="eyebrow">MALAKOI · TU SELECCIÓN</div><h1>LA BOLSA</h1><div class="cart"><section class="items" id="items"></section><aside class="summary"><h2>Resumen del pedido</h2><div class="row"><span>Subtotal</span><span id="subtotal">S/ 0.00</span></div><div class="row"><span>Envío</span><span>Gratis</span></div><div class="row total"><span>Total</span><span id="total">S/ 0.00</span></div><a class="checkout" href="contacto.html">CONTINUAR CON EL PEDIDO</a></aside></div></main><script>const itemsEl=document.querySelector('#items');let bag=JSON.parse(localStorage.getItem('malakoiBag')||'[]');function render(){if(!bag.length){itemsEl.innerHTML='<div class="empty">Tu bolsa está esperando piezas con carácter.<br><br><a href="catalogo.html"><strong>EXPLORAR CATÁLOGO →</strong></a></div>';return}itemsEl.innerHTML=bag.map((item,i)=>`<article class="item"><img src="${item.image}" alt="${item.name}"><div><h2>${item.name}</h2><p>Prenda Malakoi · Talla única</p><strong>${item.price}</strong></div><button class="remove" data-index="${i}">ELIMINAR</button></article>`).join('');const total=bag.reduce((sum,item)=>sum+145,0);document.querySelector('#subtotal').textContent='S/ '+total.toFixed(2);document.querySelector('#total').textContent='S/ '+total.toFixed(2);document.querySelectorAll('.remove').forEach(btn=>btn.onclick=()=>{bag.splice(+btn.dataset.index,1);localStorage.setItem('malakoiBag',JSON.stringify(bag));render()})}render();</script></body></html>
